<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img">
  <title>Sliding-puzzle specialist and generalist ranking flip</title>
  <desc>The Easy specialist has slightly greater efficiency, but the Full generalist has substantially greater context diversity and therefore a larger I cd score.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .heading { fill: #0f172a; font-size: 32px; font-weight: 750; }
      .title { fill: #0f172a; font-size: 30px; font-weight: 700; }
      .scope { font-size: 24px; font-weight: 700; }
      .metric { fill: #334155; font-size: 27px; font-weight: 650; }
      .value { fill: #0f172a; font-size: 27px; font-weight: 750; }
      .rank { fill: #475569; font-size: 25px; font-weight: 600; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .track { fill: #e2e8f0; }
    </style>
  </defs>

  <rect width="1000" height="650" rx="26" fill="#f8fafc"/>
  <text x="500" y="48" text-anchor="middle" class="heading">A small efficiency edge can lose to a large breadth gap.</text>

  <rect x="40" y="78" width="920" height="224" rx="22" class="card"/>
  <path d="M 82 101 L 103 138 L 61 138 z" fill="#d97706"/>
  <text x="120" y="132" class="title">Easy specialist</text>
  <text x="380" y="132" fill="#92400e" class="scope">grid widths 2–3</text>
  <rect x="670" y="96" width="255" height="55" rx="16" fill="#fff7e6" stroke="#d97706" stroke-width="2"/>
  <text x="797.5" y="133" text-anchor="middle" fill="#92400e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="750">Score 1.094 × 10⁻³</text>

  <text x="75" y="190" class="metric">Efficiency η</text>
  <text x="440" y="190" text-anchor="end" class="value">0.793 × 10⁻³</text>
  <rect x="75" y="207" width="365" height="20" rx="10" class="track"/>
  <rect x="75" y="207" width="365" height="20" rx="10" fill="#d97706"/>
  <text x="530" y="190" class="metric">Context diversity</text>
  <text x="925" y="190" text-anchor="end" class="value">1.38 nats</text>
  <rect x="530" y="207" width="395" height="20" rx="10" class="track"/>
  <rect x="530" y="207" width="237" height="20" rx="10" fill="#f59e0b"/>
  <text x="75" y="271" class="rank">efficiency rank #1</text>
  <text x="925" y="271" text-anchor="end" fill="#92400e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="750">combined rank #4</text>

  <rect x="40" y="326" width="920" height="224" rx="22" class="card"/>
  <circle cx="82" cy="123" r="23" fill="#0072b2" transform="translate(0 248)"/>
  <text x="120" y="380" class="title">Full generalist</text>
  <text x="380" y="380" fill="#075985" class="scope">grid widths 2–5</text>
  <rect x="670" y="344" width="255" height="55" rx="16" fill="#eaf7fd" stroke="#0072b2" stroke-width="2"/>
  <text x="797.5" y="381" text-anchor="middle" fill="#075985" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="750">Score 1.795 × 10⁻³</text>

  <text x="75" y="438" class="metric">Efficiency η</text>
  <text x="440" y="438" text-anchor="end" class="value">0.781 × 10⁻³</text>
  <rect x="75" y="455" width="365" height="20" rx="10" class="track"/>
  <rect x="75" y="455" width="359" height="20" rx="10" fill="#0072b2"/>
  <text x="530" y="438" class="metric">Context diversity</text>
  <text x="925" y="438" text-anchor="end" class="value">2.30 nats</text>
  <rect x="530" y="455" width="395" height="20" rx="10" class="track"/>
  <rect x="530" y="455" width="395" height="20" rx="10" fill="#0096d6"/>
  <text x="75" y="519" class="rank">efficiency rank #2</text>
  <text x="925" y="519" text-anchor="end" fill="#075985" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="750">combined rank #1</text>

  <rect x="74" y="579" width="852" height="46" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="500" y="610" text-anchor="middle" fill="#0c4a6e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="750">Efficiency: Easy #1, Full #2  →  Combined: Full #1, Easy #4</text>
</svg>
